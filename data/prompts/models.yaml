# Main models: mistral_7b, gemma_9b, llama_8b. The other five are the larger and reasoning models of the boundary experiments; no per-example data for them is released.
llama_8b:
  model_id: "meta-llama/Llama-3.1-8B-Instruct"
  short_name: "llama"
  has_system_role: true
  system_prompt: "You are a helpful, knowledgeable assistant."
  canonical_decoding:
    temperature: 0.0
    top_p: 1.0
    max_new_tokens: 2048
  layer_accessor: "model.layers"
  dtype: "bfloat16"

